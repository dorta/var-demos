version = 1

[platforms.imx8mplus]
name = "i.MX 8M Plus"
compatible = ["fsl,imx8mp"]
status = "validated"
asset_base_url = "https://nyc3.digitaloceanspaces.com/variscite-marketing/demos/machine-learning/imx8mplus/v2"
delegate_path = "/usr/lib/libvx_delegate.so"
runtime_plugins = "appsink decodebin imxvideoconvert_g2d"

[platforms.imx93]
name = "i.MX 93"
compatible = ["fsl,imx93"]
status = "pending"

[platforms.imx95]
name = "i.MX 95"
compatible = ["fsl,imx95"]
status = "validated"
asset_base_url = "https://nyc3.digitaloceanspaces.com/variscite-marketing/demos/machine-learning/imx95/v1"
delegate_path = "/usr/lib/libneutron_delegate.so"
runtime_plugins = "appsink v4l2src videoconvert"

[[demos]]
id = "neutron-classification"
title = "Neutron camera classification and preview"
path = "neutron-classification"
platforms = ["imx95"]
entrypoint = "python3 demo.py"
manifest = "assets.manifest"

[[launchers]]
id = "neutron-camera"
title = "Classify the camera with Neutron"
description = "MobileNet V1 on the MX95 NPU; tested CSI0 OV5640 camera"
demo = "neutron-classification"
command = ["python3", "demo.py", "--camera", "/dev/video0"]

[[launchers]]
id = "mx95-camera-preview"
title = "Preview the MX95 camera"
description = "CSI0 OV5640 live preview without inference"
demo = "neutron-classification"
command = ["python3", "demo.py", "--preview", "--camera", "/dev/video0"]

[[demos]]
id = "classification"
title = "Image, video, and camera classification"
path = "classification"
platforms = ["imx8mplus"]
entrypoint = "python3 image_classification.py"
manifest = "assets.manifest"

[[demos]]
id = "detection"
title = "Image, video, and camera object detection"
path = "detection"
platforms = ["imx8mplus"]
entrypoint = "python3 image_detection.py"
manifest = "assets.manifest"

[[demos]]
id = "high-resolution-video-detection"
title = "High-resolution video object detection"
path = "high-resolution-video-detection"
platforms = ["imx8mplus"]
entrypoint = "python3 high-resolution-video-detection.py --combination 2"
manifest = "assets.manifest"

[[demos]]
id = "hand-gesture"
title = "Experimental hand landmarks and gestures"
path = "hand-gesture"
platforms = ["imx8mplus"]
entrypoint = "python3 demo.py --camera /dev/video4"
manifest = "assets.manifest"

[[launchers]]
id = "hand-gesture-camera"
title = "Recognize a hand and gestures (experimental)"
category = "HAND AND GESTURES"
menu_title = "Camera"
description = "single hand; open, fist, pointing or victory; experimental"
demo = "hand-gesture"
command = ["python3", "demo.py", "--camera", "{camera}"]

[[launchers]]
id = "classification-image"
title = "Classify an image"
category = "CLASSIFICATION"
menu_title = "Image"
description = "identify the main subject in a sample image"
demo = "classification"
command = ["python3", "image_classification.py"]

[[launchers]]
id = "classification-video"
title = "Classify a video"
category = "CLASSIFICATION"
menu_title = "Video"
description = "identify the main subject in each video frame"
demo = "classification"
command = ["python3", "video_classification.py", "--videofmw", "gstreamer"]

[[launchers]]
id = "classification-camera"
title = "Classify the camera feed"
category = "CLASSIFICATION"
menu_title = "Camera"
description = "classify the live camera feed"
demo = "classification"
command = ["python3", "realtime_classification.py", "--camera", "{camera}"]

[[launchers]]
id = "detection-image"
title = "Detect objects in an image"
category = "OBJECT DETECTION"
menu_title = "Image"
description = "locate and label objects in a sample image"
demo = "detection"
command = ["python3", "image_detection.py"]

[[launchers]]
id = "detection-video"
title = "Detect objects in a video"
category = "OBJECT DETECTION"
menu_title = "Video"
description = "locate and label objects in a sample video"
demo = "detection"
command = ["python3", "video_detection.py", "--videofmw", "gstreamer"]

[[launchers]]
id = "detection-camera"
title = "Detect objects in the camera feed"
category = "OBJECT DETECTION"
menu_title = "Camera"
description = "locate and label objects from the live camera"
demo = "detection"
command = ["python3", "realtime_detection.py", "--camera", "{camera}"]

[[launchers]]
id = "detection-hd-video"
select_video = true
title = "Detect objects in a high-resolution video"
category = "HIGH-RESOLUTION DETECTION"
menu_title = "HD video"
description = "choose footage and resolution before running detection"
demo = "high-resolution-video-detection"
command = ["python3", "high-resolution-video-detection.py", "--combination", "2"]

[[videos]]
demo = "high-resolution-video-detection"
title = "Chicago traffic — HD 1280x720, 17 seconds"
path = "assets/videos/chicago_1280x720.mp4"
combination = 2

[[videos]]
demo = "high-resolution-video-detection"
title = "Jijiga street — HD 1280x720, 11 seconds"
path = "assets/videos/video_1280x720.mp4"
combination = 2

[[videos]]
demo = "high-resolution-video-detection"
title = "Jijiga street — 1280x800, 11 seconds"
path = "assets/videos/video_1280x800.mp4"
combination = 8

[[videos]]
demo = "high-resolution-video-detection"
title = "Jijiga street — Full HD 1920x1080, 11 seconds"
path = "assets/videos/video_1920x1080.mp4"
combination = 14
